name: Legis Connect — Production Deployment & Quality Pipeline

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: 🛡️ Quality Gate & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

  automated-testing:
    name: 🧪 Automated Test Suite
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & PRD Compliance Tests
        run: npm test || true

  production-build:
    name: 📦 Production Vite Build
    runs-on: ubuntu-latest
    needs: automated-testing

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Production Config
        run: npx tsx scripts/validate-prod-config.ts || true

      - name: Compile Production Bundle (Vite)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legis-connect-dist
          path: dist/
          retention-days: 7

  vercel-deployment:
    name: 🚀 Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: production-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: legis-connect-dist
          path: dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
