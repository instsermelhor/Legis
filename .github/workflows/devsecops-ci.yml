name: DevSecOps Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-and-build:
    name: "DevSecOps Master Pipeline"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. ESLint Security Scan
        run: npm run lint

      - name: 2. TypeScript Static Typecheck
        run: npm run typecheck

      - name: 3. Secret Scanning Gate
        run: npm run secret-scan

      - name: 4. Automated Testing Pipeline (22 Suites)
        run: npm test

      - name: 5. Production Build Verification
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 6. Dependency Vulnerability Audit
        run: npm audit --audit-level=high
        continue-on-error: true
