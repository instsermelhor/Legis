# Legis Connect — Quality Gates Obrigatórios
# Bloqueia merge/deploy se qualquer gate falhar
# Standards: DORA Elite | SonarQube Quality Gate | Pact Contract Tests

name: "Quality Gates"
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  unit-tests-coverage:
    name: "Unit Tests + Coverage Gate (≥ 80%)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: Run tests with coverage
        run: |
          npm run test:cov -- \
            --coverageThreshold='{"global":{"lines":80,"functions":80,"branches":75}}'
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-scan-action@master
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}", SONAR_HOST_URL: "${{ secrets.SONAR_HOST_URL }}" }
      - uses: SonarSource/sonarqube-quality-gate-action@master
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }

  api-contract-tests:
    name: "Pact Contract Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run test:pact
      - name: Publish to Pact Broker + Verify Provider
        run: |
          npx pact-broker publish ./pacts \
            --broker-base-url=${{ secrets.PACT_BROKER_URL }} \
            --consumer-app-version=${{ github.sha }}

  e2e-critical-journeys:
    name: "E2E Critical Journeys (Playwright)"
    runs-on: ubuntu-latest
    needs: [unit-tests-coverage]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: npx playwright install chromium --with-deps
      - name: Run @critical tagged tests only
        run: npx playwright test --grep @critical
        env: { BASE_URL: "${{ secrets.STAGING_URL }}" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }

  performance-regression:
    name: "Performance Regression (k6 SLOs)"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-v0.52.0-linux-amd64/k6 /usr/local/bin
      - name: Run load test (100 VUs / 5 min baseline)
        run: k6 run --vus 100 --duration 5m tests/performance/api-load-test.k6.js
        env: { HOST: "${{ secrets.STAGING_API_HOST }}", LOAD_TEST_PASSWORD: "${{ secrets.LOAD_TEST_PASSWORD }}" }
