# Legis Connect — Enterprise Quality Gates Pipeline
# Cadeia de Garantia de Qualidade e Segurança para Push e Pull Requests
# Security Gate: CRITICAL ou HIGH não mitigado = DEPLOY BLOCKED (exit 1)

name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  enterprise-quality-gate:
    name: "Enterprise Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: 1. ESLint — Zero Warnings Gate
        run: npm run lint

      - name: 2. TypeScript — Typecheck Gate (0 errors)
        run: npm run typecheck

      - name: 3. DevSecOps — Secrets & Credentials Scanning Gate
        run: npm run secret-scan

      - name: 4. Master Automated Test Suite (22 Suites)
        run: npm test

      - name: 5. 🛡️ Enterprise Security Audit Gate (SAST + RBAC + RLS + Headers)
        run: npm run sast
        # EXIT CODE 1 se CRITICAL ou HIGH não mitigado → bloqueia deploy automaticamente

      - name: 6. Production Build Gate (Vite Bundle Compilation)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 7. Verify Production Artifacts
        run: |
          echo "=== Dist Artifacts Verification ==="
          ls -lh dist/
          du -sh dist/
          echo "✅ Enterprise Quality Gate 100% Passed!"

  security-audit:
    name: "Dependency Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: npm audit (high+critical only)
        run: npm audit --audit-level=high
        continue-on-error: true
