name: 🚀 Deploy — Legis Connect → Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build de produção + Quality Gate
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔎 ESLint — 0 warnings gate
        run: npm run lint

      - name: 🛡️ npm audit (high+critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 🏗️ Build de produção
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: 📋 Verificar artefatos do build
        run: |
          echo "=== Arquivos em dist/ ==="
          ls -lh dist/assets/ | head -30
          echo "=== Tamanho total ==="
          du -sh dist/
          echo "✅ Build gate passed"

      - name: 📤 Upload dist para próximos jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy para Vercel Production
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy → Vercel Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://legisconnect.com.br
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 📥 Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-production
          path: dist/

      - name: 🚀 Deploy → Vercel Production
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Health check pós-deploy
  # ─────────────────────────────────────────────────────────────
  health-check:
    name: 🩺 Health Check Pós-Deploy
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ⏳ Aguardar propagação (20s)
        run: sleep 20

      - name: 🩺 Verificar /api/health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://legisconnect.com.br/api/health || echo "000")
          echo "Health Check HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ API Health Check OK"
          else
            echo "⚠️ Health check retornou HTTP $STATUS"
          fi
        continue-on-error: true

      - name: 🌐 Verificar homepage
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://legisconnect.com.br || echo "000")
          echo "Homepage HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "✅ Site respondendo (HTTP $STATUS)"
          else
            echo "⚠️ Site retornou HTTP $STATUS"
          fi
        continue-on-error: true

      - name: 🔔 Notificar Sentry sobre novo release
        if: success()
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            npx @sentry/cli releases new "${{ github.sha }}" --org legis-connect --project legis-connect-web || true
            npx @sentry/cli releases finalize "${{ github.sha }}" --org legis-connect || true
            echo "✅ Sentry release: ${{ github.sha }}"
          else
            echo "ℹ️ SENTRY_AUTH_TOKEN não configurado — pulando."
          fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        continue-on-error: true
