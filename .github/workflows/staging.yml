name: 🔄 Staging Preview — Legis Connect

on:
  push:
    branches: [staging, develop]
  pull_request:
    branches: [main]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build de validação
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 🔎 ESLint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📤 Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-staging-${{ github.run_id }}
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy Preview no Vercel
  # ─────────────────────────────────────────────────────────────
  deploy-preview:
    name: 🔍 Deploy Preview → Vercel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview_url: ${{ steps.vercel_deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: 📥 Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-staging-${{ github.run_id }}
          path: dist/

      - name: 🚀 Deploy Preview → Vercel
        id: vercel_deploy
        run: |
          DEPLOY_URL=$(npx vercel --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "✅ Preview URL: $DEPLOY_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 💬 Comentar Preview URL no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.vercel_deploy.outputs.preview_url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Preview Deploy\n\n✅ **Build passou** — Preview disponível:\n\n🔗 ${previewUrl}\n\n> Deploy automático via Legis Connect CI/CD`
            });
        continue-on-error: true
