# Legis Connect — Universal CI Pipeline
# Tempo total target: < 8 minutos (jobs paralelizados)
# Standards: SLSA Level 3, CIS Controls 16.2, OWASP SAMM CI/CD

name: "Legis Connect CI — Security & Quality Gates"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/legis/${{ github.event.repository.name }}"

jobs:
  # =========================================================
  # STAGE 1: BUILD & LINT (Parallel)
  # =========================================================
  build:
    name: "Build & Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: build-dist, path: dist/ }

  # =========================================================
  # STAGE 2: UNIT & INTEGRATION TESTS (Parallel)
  # =========================================================
  test:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run test:cov
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================
  # STAGE 3: SECURITY GATES (All Parallel)
  # =========================================================
  sast:
    name: "SAST — Semgrep"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: "p/typescript p/owasp-top-ten p/nestjs p/secrets"
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  sca:
    name: "SCA — OWASP Dependency Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency Check
        uses: dependency-check/dependency-check-action@main
        with:
          format: "JSON,SARIF"
          failBuildOnCVSS: 7
          suppressionFile: ".owasp-suppressions.xml"

  secret-scan:
    name: "Secret Detection — GitLeaks"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  iac-scan:
    name: "IaC Security — Checkov"
    runs-on: ubuntu-latest
    if: contains(github.repository, 'platform-infrastructure')
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with: { directory: ".", framework: "terraform" }

  # =========================================================
  # STAGE 4: PACKAGE, SBOM, SIGN & PUSH (Sequential after gates)
  # =========================================================
  package:
    name: "Build Image → SBOM → Sign → Push ECR"
    needs: [build, test, sast, sca, secret-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # For Sigstore OIDC keyless signing
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME:$GITHUB_SHA .

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Generate SBOM (Syft — SPDX format)
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "spdx-json"
          artifact-name: "sbom.spdx.json"

      - name: Sign Container Image (Cosign keyless via Sigstore OIDC)
        run: cosign sign --yes $IMAGE_NAME:$GITHUB_SHA

      - name: Push Image to ECR
        run: docker push $IMAGE_NAME:$GITHUB_SHA

      - name: Update GitOps Repository (trigger ArgoCD sync)
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/legis-connect/platform-gitops.git
          cd platform-gitops
          sed -i "s|tag: .*|tag: $GITHUB_SHA|g" apps/development/${{ github.event.repository.name }}.yaml
          git config user.email "ci@legis-connect.com"
          git config user.name "Legis CI Bot"
          git commit -am "ci: update ${{ github.event.repository.name }} to $GITHUB_SHA"
          git push
