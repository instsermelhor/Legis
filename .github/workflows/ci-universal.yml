# Legis Connect — CI Pipeline (Simplificado para Startup → Beta)
# Executa lint + build + auditoria de segurança em todos os pushes e PRs.
# O pipeline enterprise completo (AWS ECR, ArgoCD, SonarQube) será ativado
# quando a infraestrutura cloud for provisionada (pós-Série A).

name: "CI — Lint, Build & Security"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

jobs:
  # =========================================================
  # STAGE 1: LINT & BUILD
  # =========================================================
  lint-and-build:
    name: "🔎 Lint + 🏗️ Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔎 ESLint — 0 warnings gate
        run: npm run lint

      - name: 🏗️ Build de produção
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📋 Verificar saída do build
        run: |
          echo "=== Bundle sizes ==="
          ls -lh dist/assets/*.js | sort -k5 -h | tail -10
          echo "=== Total dist size ==="
          du -sh dist/
          echo "✅ Build gate passed"

      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ci-${{ github.run_id }}
          path: dist/
          retention-days: 1

  # =========================================================
  # STAGE 2: SECURITY AUDIT
  # =========================================================
  security:
    name: "🛡️ Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🛡️ npm audit (high+critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  # =========================================================
  # STAGE 3: SECRET DETECTION
  # =========================================================
  secret-scan:
    name: "🔐 Secret Detection — GitLeaks"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Local High-Entropy Secret Scanner
        run: npm run secret-scan
