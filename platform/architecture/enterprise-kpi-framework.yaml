# platform/architecture/enterprise-kpi-framework.yaml
# Enterprise KPI Framework — Legis Connect
# Padrao: Enterprise KPI Architecture (Prompt 237 - Etapa 18)
# Governanca: Transformation Steering Committee (TSC) revisa trimestralmente
# Fonte de Dados: Metabase + Grafana + Analytics Platform (Prompt 223)

version: "1.0"
last_updated: "2026-07-27"
owner: "cfo@legis.io + cto@legis.io"
review_cadence: "quarterly"

kpi_categories:

  business:
    description: "Indicadores de crescimento e saude do negocio"
    kpis:
      - id: "KPI-BIZ-001"
        name: "Annual Recurring Revenue (ARR)"
        formula: "SUM(MRR) * 12"
        source: "Billing API (Prompt 219)"
        target_2026: "R$ 10M"
        target_2027: "R$ 28M"
        alert_threshold: "< 85% do target trimestral"
        owner: "CFO"
        dashboard_panel: "Business Growth"

      - id: "KPI-BIZ-002"
        name: "Net Revenue Retention (NRR)"
        formula: "(MRR_start + Expansion - Contraction - Churn) / MRR_start * 100"
        source: "Billing API + CRM (Prompt 226)"
        target_2026: "> 115%"
        target_2027: "> 120%"
        alert_threshold: "< 100% (Churn > Expansion)"
        owner: "CFO + CPO"
        dashboard_panel: "Business Growth"

      - id: "KPI-BIZ-003"
        name: "MoM Revenue Growth Rate"
        formula: "(ARR_current - ARR_prev) / ARR_prev * 100"
        source: "Billing API"
        target_2026: "> 15%"
        target_2027: "> 12%"
        alert_threshold: "< 8% por 2 meses consecutivos"
        owner: "CEO + CFO"
        dashboard_panel: "Business Growth"

      - id: "KPI-BIZ-004"
        name: "CAC Payback Period"
        formula: "CAC / (MRR_per_customer * Gross_Margin)"
        source: "CRM + Billing (Prompts 226, 219)"
        target_2026: "< 12 meses"
        target_2027: "< 9 meses"
        alert_threshold: "> 18 meses"
        owner: "CFO + CMO"
        dashboard_panel: "Business Growth"

  product:
    description: "Indicadores de adocao e engajamento do produto"
    kpis:
      - id: "KPI-PRD-001"
        name: "Monthly Active Users (MAU)"
        formula: "COUNT(DISTINCT user_id WHERE last_active >= NOW() - 30d)"
        source: "Analytics Platform (Prompt 223)"
        target_2026: "50.000"
        target_2027: "150.000"
        alert_threshold: "< 80% do target mensal"
        owner: "CPO"
        dashboard_panel: "Product & Growth"

      - id: "KPI-PRD-002"
        name: "Feature Adoption Rate"
        formula: "DAU_com_feature / MAU * 100"
        source: "Analytics Platform (Prompt 223)"
        target_2026: "> 40%"
        target_2027: "> 55%"
        alert_threshold: "< 25% por feature critica"
        owner: "CPO + Product Leads"
        dashboard_panel: "Product & Growth"

      - id: "KPI-PRD-003"
        name: "Net Promoter Score (NPS)"
        formula: "% Promotores - % Detratores"
        source: "CRM (Prompt 226) + Pesquisa trimestral"
        target_2026: "> 50"
        target_2027: "> 65"
        alert_threshold: "< 30 por 2 trimestres"
        owner: "CPO + Head CX"
        dashboard_panel: "Customer Experience"

  ai:
    description: "Indicadores de performance e eficiencia da IA"
    kpis:
      - id: "KPI-AI-001"
        name: "AI Deflection Rate"
        formula: "Cases_resolvidos_sem_advogado_humano / Total_Cases * 100"
        source: "AI Platform (Prompt 231)"
        target_2026: "> 30%"
        target_2027: "> 45%"
        alert_threshold: "< 20%"
        owner: "CDO + Head AI"
        dashboard_panel: "AI & Automation"

      - id: "KPI-AI-002"
        name: "AI Response Accuracy (Legal Research)"
        formula: "Respostas_corretas_avaliadas / Total_avaliadas"
        source: "LLM-as-Judge evaluation pipeline (Prompt 217)"
        target_2026: "> 87%"
        target_2027: "> 92%"
        alert_threshold: "< 80% — Trigger model rollback"
        owner: "CDO + Head AI"
        dashboard_panel: "AI & Automation"

      - id: "KPI-AI-003"
        name: "AI Cost per Active User (Daily)"
        formula: "Total_AI_Cost_Daily / DAU"
        source: "FinOps Dashboard (Prompt 233) + LiteLLM"
        target_2026: "< R$ 0.30/user/dia"
        target_2027: "< R$ 0.20/user/dia"
        alert_threshold: "> R$ 0.50/user/dia (AI budget breach)"
        owner: "CFO + CDO"
        dashboard_panel: "FinOps & Costs"

  technology:
    description: "Indicadores de saude e confiabilidade da plataforma"
    kpis:
      - id: "KPI-TECH-001"
        name: "Platform Availability (SLA)"
        formula: "(Total_minutes - Downtime_minutes) / Total_minutes * 100"
        source: "Observabilidade (Prompt 228) — Uptime Robot"
        target_2026: "> 99.95%"
        target_2027: "> 99.99%"
        alert_threshold: "< 99.9% em qualquer mes"
        owner: "CTO + Head SRE"
        dashboard_panel: "Platform Health"

      - id: "KPI-TECH-002"
        name: "Mean Time to Detect (MTTD)"
        formula: "AVG(detection_time - incident_start_time)"
        source: "SOC Platform (Prompt 221)"
        target_2026: "< 5 minutos"
        target_2027: "< 2 minutos"
        alert_threshold: "> 15 minutos"
        owner: "CISO + Head SOC"
        dashboard_panel: "Security & Compliance"

      - id: "KPI-TECH-003"
        name: "Deployment Frequency"
        formula: "COUNT(deploys_em_producao) por semana"
        source: "GitHub Actions + ArgoCD (Prompt 222)"
        target_2026: "> 10/semana"
        target_2027: "> 20/semana"
        alert_threshold: "< 3/semana (indicador de bloqueio no pipeline)"
        owner: "CTO + Head Platform"
        dashboard_panel: "Platform Health"

  security:
    description: "Indicadores de seguranca e conformidade"
    kpis:
      - id: "KPI-SEC-001"
        name: "Critical Vulnerabilities Open > 24h"
        formula: "COUNT(critical_vulns WHERE age > 24h)"
        source: "Trivy + Snyk (Prompt 222)"
        target_2026: "0"
        target_2027: "0"
        alert_threshold: "> 0 (immediate escalation to CISO)"
        owner: "CISO + Head Security"
        dashboard_panel: "Security & Compliance"

      - id: "KPI-SEC-002"
        name: "LGPD Data Request Response Time"
        formula: "AVG(response_time_days) para DSARs"
        source: "GRC Platform (Prompt 224)"
        target_2026: "< 15 dias uteis"
        target_2027: "< 10 dias uteis"
        alert_threshold: "> 30 dias (limite legal LGPD)"
        owner: "DPO + CISO"
        dashboard_panel: "Security & Compliance"

  financial:
    description: "Indicadores financeiros e de otimizacao de custos"
    kpis:
      - id: "KPI-FIN-001"
        name: "Cloud Cost per MAU"
        formula: "Total_Cloud_Cost_Monthly / MAU"
        source: "OpenCost + AWS Cost Explorer (Prompt 233)"
        target_2026: "< R$ 8.00/usuario/mes"
        target_2027: "< R$ 6.00/usuario/mes"
        alert_threshold: "> R$ 12.00 (eficiencia abaixo do threshold)"
        owner: "CFO + FinOps Lead"
        dashboard_panel: "FinOps & Costs"

      - id: "KPI-FIN-002"
        name: "Gross Margin"
        formula: "(ARR - COGS) / ARR * 100"
        source: "Billing + FinOps (Prompts 219, 233)"
        target_2026: "> 65%"
        target_2027: "> 72%"
        alert_threshold: "< 55% (SaaS benchmark warning)"
        owner: "CFO"
        dashboard_panel: "Business Growth"

  employee_experience:
    description: "Indicadores de saude e produtividade dos colaboradores"
    kpis:
      - id: "KPI-EX-001"
        name: "Employee Net Promoter Score (eNPS)"
        formula: "% Promotores - % Detratores (pesquisa trimestral)"
        source: "Digital Workplace (Prompt 235)"
        target_2026: "> 40"
        target_2027: "> 55"
        alert_threshold: "< 20 por 2 trimestres consecutivos"
        owner: "CDO + Head People"
        dashboard_panel: "Collaboration & People"

      - id: "KPI-EX-002"
        name: "AI Productivity Tasks per User per Day"
        formula: "Total_AI_tasks_completed / DAU_employees"
        source: "AI Productivity Platform (Prompt 235)"
        target_2026: "> 5 tarefas/dia"
        target_2027: "> 10 tarefas/dia"
        alert_threshold: "< 2 tarefas/dia (baixa adocao)"
        owner: "CDWO + CDO"
        dashboard_panel: "Collaboration & People"

dashboard_config:
  technology: "Metabase Enterprise + Grafana + Custom Next.js (Prompt 218)"
  refresh_rate_technical: "real-time (WebSocket)"
  refresh_rate_business: "daily (batch)"
  access_control: "Role-based (C-Suite: todos | Squads: dominio proprio)"
  alert_channels: ["PagerDuty", "Slack #executive-alerts", "Email DL-cxo"]
